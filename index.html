<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set the Bar</title>
<style>
:root{
  --bg:#f5f6f8;--card:#ffffff;--ink:#1c2230;--muted:#5d6676;--line:#d4d8df;--soft:#eef0f4;
  --dot:#e0393e;--off:#c6cad2;--bar:#2563eb;--zone:rgba(37,99,235,.08);
  --A:#2563eb;--B:#c2410c;--fillA:rgba(37,99,235,.55);--fillB:rgba(194,65,12,.55);--pale:#dfe3ea;
  --target:#b45309;--ok:#15803d;--okbg:rgba(22,163,74,.12);--warn:#b91c1c;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11141a;--card:#1a1e26;--ink:#e7eaf0;--muted:#9aa3b2;--line:#363c48;--soft:#232833;
  --dot:#ff5d62;--off:#4b515d;--bar:#60a5fa;--zone:rgba(96,165,250,.12);
  --A:#60a5fa;--B:#fb923c;--fillA:rgba(96,165,250,.55);--fillB:rgba(251,146,60,.55);--pale:#2c323d;
  --target:#fbbf24;--ok:#4ade80;--okbg:rgba(74,222,128,.13);--warn:#f87171;
}}
:root[data-theme="dark"]{
  --bg:#11141a;--card:#1a1e26;--ink:#e7eaf0;--muted:#9aa3b2;--line:#363c48;--soft:#232833;
  --dot:#ff5d62;--off:#4b515d;--bar:#60a5fa;--zone:rgba(96,165,250,.12);
  --A:#60a5fa;--B:#fb923c;--fillA:rgba(96,165,250,.55);--fillB:rgba(251,146,60,.55);--pale:#2c323d;
  --target:#fbbf24;--ok:#4ade80;--okbg:rgba(74,222,128,.13);--warn:#f87171;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-bottom:12px}
h1{font-size:1.5rem;margin:0}
header p{margin:0;color:var(--muted)}
.bar-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;color:var(--ink);padding:8px 14px;font:inherit;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--bar);color:#fff}
.seg button:hover{filter:brightness(.96)}
.fname{font-weight:700;color:#b7791f}
.seg button[aria-pressed="true"] .fname{color:#fde047}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fname{color:#fbbf24}
  :root:not([data-theme="light"]) .seg button[aria-pressed="true"] .fname{color:#fef08a;text-shadow:0 0 3px #1e3a8a,0 1px 2px #0b1220}}
:root[data-theme="dark"] .fname{color:#fbbf24}
:root[data-theme="dark"] .seg button[aria-pressed="true"] .fname{color:#fef08a;text-shadow:0 0 3px #1e3a8a,0 1px 2px #0b1220}
.lbl{color:var(--muted);font-size:.9rem}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0}
/* goal banner */
.banner{--c:var(--bar);display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:0 0 8px;padding:10px 14px;border-radius:12px;
  border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 9%,var(--card));line-height:1.4}
.banner.inv{--c:var(--target)}
.banner .tag{font-size:.72rem;font-weight:800;letter-spacing:.12em;color:var(--card);background:var(--c);padding:3px 9px;border-radius:999px}
.banner .goal{font-size:1.08rem}
.banner .dir{font-weight:700;color:var(--c)}
.banner .chip{display:inline-block;font-weight:800;font-size:1.12em;color:var(--c);background:var(--card);border:1.5px solid var(--c);border-radius:8px;padding:0 8px;margin-left:2px}
.banner .chip input{width:4.6em;border:0;background:transparent;font:inherit;color:inherit;text-align:center;padding:0;margin:0 0 0 2px}
.banner .chip input:focus{outline:2px solid var(--c);outline-offset:2px;border-radius:4px}
.banner .play{border:0;border-radius:999px;background:var(--c);color:var(--card);font:inherit;font-weight:700;padding:4px 14px;cursor:pointer}
.banner .ackBtn{border:0;border-radius:999px;background:#c2410c;color:#fff;font:inherit;font-weight:700;padding:3px 12px;margin-left:8px;cursor:pointer}
.banner .status{margin-left:auto;font-weight:700;font-size:.95rem;padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.banner .status.ok{color:var(--ok);border-color:var(--ok);background:var(--okbg)}
.banner .status.near{color:var(--target);border-color:var(--target)}
.banner .status.go{color:var(--muted)}
.banner .note{flex-basis:100%;font-size:.85rem;color:var(--muted);margin-top:-2px}
svg{display:block;width:100%;height:auto;touch-action:none;user-select:none}
.m{font-family:"Times New Roman",Times,serif;font-size:1.1em}
.m i{font-style:italic}
.readouts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:8px}
.ro{border-radius:10px;padding:10px 12px;background:var(--soft)}
.ro .big{font-size:1.35rem}
.ro .who{font-weight:700}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
/* demo highlights */
@keyframes flash{0%{transform:scale(1)}20%{transform:scale(1.7)}40%{opacity:.2}60%{opacity:1;transform:scale(1.55)}80%{opacity:.35}100%{opacity:1;transform:scale(1.4)}}
.flash{transform-box:fill-box;transform-origin:center;animation:flash 1.2s ease forwards}
@media (prefers-reduced-motion:reduce){.flash{animation:none;transform:scale(1.4)}}
/* screenshot mode */
body.shot header,body.shot .controls{display:none!important}
body.shot .wrap{padding:8px}
body.shot .card{margin:6px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Set the Bar</h1>
    <p>Move the bar, collect the data at or below it: <span class="m"><i>X</i> ≤ <i>x</i></span></p>
  </header>

  <div class="controls">
    <div class="bar-row">
      <span class="lbl">Distribution</span>
      <div class="seg" id="distSeg">
        <button data-d="dot">Dot plot</button>
        <button data-d="hist">Histogram</button>
        <button data-d="cont">Continuous</button>
      </div>
      <span class="lbl">Run</span>
      <div class="seg" id="runSeg">
        <button data-r="demo">Demo</button>
        <button data-r="manual">Manual</button>
      </div>
    </div>
    <div class="bar-row">
      <span class="lbl">Direction</span>
      <div class="seg" id="modeSeg">
        <button data-m="1"><span class="fname">Function</span> → · Given <i>x</i>, find <i>p</i></button>
        <button data-m="2">← <span class="fname">Inverse Function</span> · Given <i>p</i>, find <i>x</i></button>
      </div>
      <label class="chk"><input type="checkbox" id="graphChk"> Show graph of <span class="m">&nbsp;<i>P</i>(<i>X</i> ≤ <i>x</i>)</span></label>
      <label class="chk" id="evenWrap"><input type="checkbox" id="evenChk"> 1-minute steps (data spread evenly inside each bar)</label>
    </div>
  </div>

  <div class="card">
    <div class="banner" id="task" aria-live="polite"></div>
    <div id="plots"></div>
    <div class="readouts" id="readouts"></div>
  </div>

  <div class="card" id="graphCard">
    <div class="legend" id="glegend"></div>
    <div id="graph"></div>
  </div>
</div>

<script>
(() => {
/* ================= data ================= */
const THETA = 1.5;            // continuous model: gamma(shape 2, scale 1.5), mean 3 h
const DS = {
  dot: [{key:'D', name:'', kind:'dot', N:24, xmin:4, xmax:20, step:1, unit:'h',
         title:'Lifespans of dry batteries', short:'Battery lifespans', xlabel:'Lifespan (hours)',
         counts:{6:2,7:1,11:3,12:4,14:2,15:3,16:5,17:1,18:3}}],
  hist: [
    {key:'A', name:'Restaurant A', kind:'hist', N:50, xmin:0, xmax:50, edges:[10,20,30,40,50], f:[5,11,13,21],
     title:'Waiting times of customers at Restaurant A', short:'Waiting times: Restaurant A', xlabel:'Waiting time (min)', unit:'min'},
    {key:'B', name:'Restaurant B', kind:'hist', N:50, xmin:0, xmax:50, edges:[10,20,30,40,50], f:[20,18,8,4],
     title:'Waiting times of customers at Restaurant B', short:'Waiting times: Restaurant B', xlabel:'Waiting time (min)', unit:'min'}],
  cont: [{key:'C', name:'', kind:'cont', N:1000, xmin:0, xmax:10, step:0.1, unit:'h',
          title:'Daily screen time of 1,000 junior-high students', short:'Daily screen time (1,000 students)',
          xlabel:'Screen time (hours per day)'}]
};
const dens = t => t<=0 ? 0 : t/(THETA*THETA)*Math.exp(-t/THETA);
// P(X <= x), as a proportion 0..1  (cumulative from the left, "以下累積")
function S(d, x){
  if(d.kind==='dot'){ let c=0; for(const v in d.counts) if(+v<=x+1e-9) c+=d.counts[v]; return c/d.N; }
  if(d.kind==='hist'){ let c=0; for(let i=0;i<d.f.length;i++){ const a=d.edges[i], b=a+10, hi=Math.min(b,x);
      if(hi>a) c+=d.f[i]*(hi-a)/(b-a); } return c/d.N; }      // classes [a,b): at a boundary b this is P(X < b) = P(X <= b)
  if(x<=0) return 0; const u=x/THETA; return 1-(1+u)*Math.exp(-u);
}

/* ================= state ================= */
const Q = new URLSearchParams(location.search);
const st = {
  dist: ['dot','hist','cont'].includes(Q.get('dist')) ? Q.get('dist') : 'dot',
  mode: Q.get('mode')==='2' ? 2 : 1,
  run:  Q.get('run')==='demo' ? 'demo' : 'manual',
  p: Q.has('p') ? +Q.get('p') : 50,
  even: Q.get('even')==='1',
  graph: Q.get('graph')==='1',
  x: {D:15, A:30, B:30, C:5},
  tx: {dot: Q.has('tx')?+Q.get('tx'):15, hist: Q.has('tx')?+Q.get('tx'):30, cont: Q.has('tx')?+Q.get('tx'):5},
  fx: {}            // demo highlights per data set: {p, x, over, ghost, ghostP, note}
};
if(Q.has('x')){ const v=+Q.get('x'); for(const k in st.x) st.x[k]=v; }
if(Q.get('theme')) document.documentElement.dataset.theme=Q.get('theme');
const SHOT = !!Q.get('shot'); if(SHOT) document.body.classList.add('shot');
const shotParts = (Q.get('shot')||'').split(',');

const stepOf = d => d.kind==='hist' ? (st.even?1:10) : d.step;
const r3 = v => Math.round(v*1000)/1000;
const snap = (d,x) => { const s=stepOf(d); return Math.min(d.xmax, Math.max(d.xmin, r3(Math.round(x/s)*s))); };
const isExact = d => d.kind==='cont' || (d.kind==='hist' && st.even);
const grid = d => { const out=[]; for(let v=d.xmin; v<=d.xmax+1e-9; v+=stepOf(d)) out.push(r3(v)); return out; };

/* ================= formatting ================= */
const fmtP = v => { const r=Math.round(v); return Math.abs(v-r)<0.05 ? r+'%' : v.toFixed(1)+'%'; };
const fmtX = (d,x) => { if(d.kind==='dot' || (d.kind==='hist'&&!st.even)) return String(Math.round(x));
  const r=Math.round(x*10)/10; return Math.abs(x-r)<1e-6 ? String(r) : x.toFixed(2); };
const M = s => `<span class="m">${s}</span>`;
const Pof = x => M(`<i>P</i>(<i>X</i> ≤ ${x})`);
const nof = x => M(`<i>n</i>(<i>X</i> ≤ ${x})`);
function countStr(d,x){ const c=S(d,x)*d.N, r=Math.round(c); return Math.abs(c-r)<1e-6 ? `${r}/${d.N}` : `≈ ${c.toFixed(1)}/${d.N}`; }

/* ================= sound (discrete data only) ================= */
let ac=null;
function tick(){ if(st.dist==='cont' || SHOT) return; try{
  ac = ac || new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(), g=ac.createGain(); o.type='square'; o.frequency.value=1700;
  g.gain.setValueAtTime(0.06,ac.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.035);
  o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+0.04);
  if(navigator.vibrate) navigator.vibrate(4);
}catch(e){} }

/* closest x on the grid for target p: smallest |p - target|; a tie goes to the larger x */
function closest(d, p){
  let best=Infinity, bx=null;
  for(const v of grid(d)){ const diff=Math.abs(S(d,v)*100-p); if(diff<best-1e-9 || Math.abs(diff-best)<1e-9){ best=diff; bx=v; } }
  return {x:bx, diff:best, p:S(d,bx)*100};
}

/* ================= geometry ================= */
let W=900, PL=64, PR=28;
const vmn = d => d.vmin ?? d.xmin, vmx = d => d.vmax ?? d.xmax;
const unitPx = d => (W-PL-PR)/(vmx(d)-vmn(d));
const sx = d => x => PL + (x-vmn(d))/(vmx(d)-vmn(d))*(W-PL-PR);
const inv = (d,px) => vmn(d) + (px-PL)/(W-PL-PR)*(vmx(d)-vmn(d));
const tickStep = d => d.kind==='hist' ? 10 : 1;
const labelEvery = d => (d.kind==='dot' && unitPx(d)<24) ? 2 : 1;
function ticksFor(d){ const t=[], s=tickStep(d); for(let x=d.xmin; x<=vmx(d)+1e-9; x+=s) t.push(r3(x)); return t; }   // no ticks left of the data range

function pLines(d,x){ const pc=fmtP(S(d,x)*100);
  if(d.kind==='cont') return [`p = ${pc}`];
  const c=countStr(d,x), eq = d.kind==='hist' ? '≈' : '=';
  return W<600 ? [`p ${eq} ${c}`, `= ${pc}`] : [`p ${eq} ${c} = ${pc}`]; }
let _cv; function textW(t){ _cv=_cv||document.createElement('canvas').getContext('2d');
  _cv.font='bold 17px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif'; return _cv.measureText(t).width; }
// the p label sits LEFT of the bar, inside the shaded (collected) area: widen the axis to the left if needed
function setView(d){
  const plotW=W-PL-PR, tick=tickStep(d), step=d.kind==='cont'?0.5:stepOf(d);
  const vmax = d.xmax + (d.kind==='dot' ? 0.6 : 0);
  let vmin = d.xmin;
  for(let k=0;k<60;k++){
    let ok=true;
    for(let x=d.xmin; x<=d.xmax+1e-9; x+=step){
      const w=Math.max(...pLines(d,x).map(textW))+20;
      if((x-vmin)/(vmax-vmin)*plotW < w){ ok=false; break; } }
    if(ok) break; vmin -= tick; }
  d.vmin=vmin; d.vmax=vmax;
}
function fitWidth(){ const el=document.getElementById('plots'); const cw=el?el.clientWidth:900;
  W=Math.round(Math.min(900, Math.max(320, cw||900))); PL=W<600?14:40; PR=W<600?14:28;
  for(const d of DS[st.dist]) setView(d); }

/* ================= plot ================= */
function barSVG(px, axisY, color, label, top, flashX, ghost){
  const op = ghost ? ' opacity=".55" stroke-dasharray="7 5"' : '';
  return `<g style="cursor:ew-resize">
    <line x1="${px}" x2="${px}" y1="${top+28}" y2="${axisY}" stroke="${color}" stroke-width="4" stroke-linecap="round"${op}/>
    <g class="${flashX?'flash':''}">
      <rect x="${px-44}" y="${top}" width="88" height="28" rx="8" fill="${color}"${ghost?' opacity=".6"':''}/>
      <text x="${px}" y="${top+19}" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" font-family="Times New Roman,serif" font-style="italic">${label}</text>
    </g>
    <path d="M${px-7},${axisY+12} L${px+7},${axisY+12} L${px},${axisY+3} Z" fill="${color}"${ghost?' opacity=".6"':''}/>
  </g>`;
}
function pLabel(d, px, y, x, color, flash, note){
  const L=pLines(d,x); if(note) L.push(note);
  const w=Math.max(...L.map(textW));
  return `<g class="${flash?'flash':''}"><rect x="${px-17-w}" y="${y-17}" width="${w+12}" height="${L.length*21+6}" rx="6" fill="var(--card)" fill-opacity=".92" stroke="${color}" stroke-opacity=".35"/>`
    + L.map((t,i)=>`<text x="${px-11}" y="${y+i*21}" text-anchor="end" font-size="17" font-weight="700" fill="${note&&i===L.length-1?'var(--warn)':color}">${t.startsWith('p ') ? '<tspan font-style="italic" font-family="Times New Roman,serif" font-size="20">p</tspan>'+t.slice(1) : t}</text>`).join('') + `</g>`;
}
function plotSVG(d){
  const X=sx(d), x=st.x[d.key], fx=st.fx[d.key]||{};
  const color = d.key==='B' ? 'var(--B)' : 'var(--bar)';
  let H, axisY, top, g='';
  if(d.kind==='dot'){
    H=280; axisY=232; top=44;
    const R=Math.min(9, unitPx(d)*0.42), GAP=Math.min(22, 2*R+4);
    g+=`<rect x="${PL}" y="${top}" width="${Math.max(0,X(x)+R+3-PL)}" height="${axisY-top}" fill="var(--zone)"/>`;
    if(fx.ghost!=null) g+=barSVG(X(fx.ghost), axisY, color, `x = ${fmtX(d,fx.ghost)}`, top+66, fx.ghostX, true);   // one row lower: never hidden
    g+=barSVG(X(x), axisY, color, `x = ${fmtX(d,x)}`, top, fx.x);
    for(const v in d.counts) for(let k=0;k<d.counts[v];k++){
      const on=+v<=x+1e-9; g+=`<circle cx="${X(+v)}" cy="${axisY-R-7-k*GAP}" r="${R}" fill="${on?'var(--dot)':'var(--off)'}" stroke="var(--card)" stroke-width="2"/>`; }
    if(fx.ghost!=null) g+=pLabel(d, X(fx.ghost), top+124, fx.ghost, color, fx.ghostP);
    g+=pLabel(d, X(x), 96, x, color, fx.p, fx.note);
  } else if(d.kind==='hist'){
    H=300; axisY=246; top=46; const fmax=25, Y=f=>axisY-(f/fmax)*(axisY-top);
    for(let f=5;f<=fmax;f+=5) g+=`<line x1="${X(d.xmin)}" x2="${W-PR}" y1="${Y(f)}" y2="${Y(f)}" stroke="var(--soft)"/><text x="${X(d.xmin)-6}" y="${Y(f)+5}" text-anchor="end" font-size="13" fill="var(--muted)">${f}</text>`;
    g+=`<rect x="${PL}" y="${top}" width="${Math.max(0,X(x)-PL)}" height="${axisY-top}" fill="var(--zone)"/>`;
    const fill = d.key==='B' ? 'var(--fillB)' : 'var(--fillA)';
    for(let i=0;i<d.f.length;i++){ const a=d.edges[i], b=a+10, y=Y(d.f[i]);
      g+=`<rect x="${X(a)}" y="${y}" width="${X(b)-X(a)}" height="${axisY-y}" fill="var(--pale)"/>`;
      const hi=Math.min(b,x); if(hi>a) g+=`<rect x="${X(a)}" y="${y}" width="${X(hi)-X(a)}" height="${axisY-y}" fill="${fill}"/>`;
      g+=`<rect x="${X(a)}" y="${y}" width="${X(b)-X(a)}" height="${axisY-y}" fill="none" stroke="${color}" stroke-width="1.6"/>`;
      g+=`<text x="${(X(a)+X(b))/2}" y="${y-6}" text-anchor="middle" font-size="13" fill="var(--muted)">${d.f[i]}</text>`; }
    if(fx.ghost!=null){ g+=barSVG(X(fx.ghost), axisY, color, `x = ${fmtX(d,fx.ghost)}`, top+60, fx.ghostX, true);
      g+=pLabel(d, X(fx.ghost), top+118, fx.ghost, color, fx.ghostP); }
    g+=barSVG(X(x), axisY, color, `x = ${fmtX(d,x)}`, top-6, fx.x);
    g+=pLabel(d, X(x), top+46, x, color, fx.p, fx.note);
  } else {
    H=290; axisY=240; top=46; const ymax=0.27, Y=v=>axisY-(v/ymax)*(axisY-top);
    let path=`M${X(0)},${axisY}`;
    for(let t=0;t<=vmx(d)+1e-9;t+=0.05) path+=` L${X(t)},${Y(dens(t))}`;
    const nobar=Q.get('nobar')==='1';
    if(!nobar && x>0){ let area=`M${X(0)},${axisY}`; for(let t=0;t<=x+1e-9;t+=0.05) area+=` L${X(t)},${Y(dens(t))}`;
      area+=` L${X(x)},${Y(dens(x))} L${X(x)},${axisY} Z`; g+=`<path d="${area}" fill="var(--fillA)"/>`; }
    g+=`<path d="${path}" fill="none" stroke="var(--A)" stroke-width="3"/>`;
    if(!nobar){
      if(fx.ghost!=null){ g+=barSVG(X(fx.ghost), axisY, color, `x = ${fmtX(d,fx.ghost)}`, top+60, fx.ghostX, true);
        g+=pLabel(d, X(fx.ghost), top+118, fx.ghost, color, fx.ghostP); }
      g+=barSVG(X(x), axisY, color, `x = ${fmtX(d,x)}`, top-6, fx.x);
      g+=pLabel(d, X(x), top+46, x, color, fx.p, fx.note); }
  }
  // axis
  g+=`<line x1="${PL-6}" x2="${W-PR+6}" y1="${axisY}" y2="${axisY}" stroke="var(--ink)" stroke-width="1.6"/>`;
  ticksFor(d).forEach((t,ti)=>{ g+=`<line x1="${X(t)}" x2="${X(t)}" y1="${axisY-5}" y2="${axisY+5}" stroke="var(--ink)" stroke-width="1.4"/>`;
    if(ti%labelEvery(d)===0) g+=`<text x="${X(t)}" y="${axisY+24}" text-anchor="middle" font-size="15" fill="var(--ink)">${t}</text>`; });
  g+=`<text x="${(X(d.xmin)+W-PR)/2}" y="${axisY+46}" text-anchor="middle" font-size="15" fill="var(--muted)">${d.xlabel}</text>`;
  const title=`<text x="${W/2}" y="24" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink)">${W<600&&d.short?d.short:d.title}</text>`;
  return `<svg viewBox="0 0 ${W} ${H+20}" data-key="${d.key}" tabindex="0" role="slider" aria-label="${d.title}: cut-off x" aria-valuenow="${x}">${title}${g}</svg>`;
}

/* ================= graph of P(X <= x) ================= */
function graphSVG(){
  const list=DS[st.dist], d0=list[0], X=sx(d0), H=250, top=20, axisY=210, Y=v=>axisY-(v/100)*(axisY-top);
  let g='';
  for(let v=0;v<=100;v+=20) g+=`<line x1="${X(d0.xmin)}" x2="${W-PR}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--soft)"/><text x="${X(d0.xmin)-6}" y="${Y(v)+5}" text-anchor="end" font-size="13" fill="var(--muted)">${v}%</text>`;
  for(const d of list){
    const col = d.key==='B' ? 'var(--B)' : 'var(--A)';
    if(d.kind==='dot'){   // right-continuous steps: closed dot at each data value, open dot at the end of each step
      const vals=Object.keys(d.counts).map(Number).sort((a,b)=>a-b);
      const pts=[d.xmin, ...vals, vmx(d)];
      for(let i=0;i<pts.length-1;i++){ const a=pts[i], b=pts[i+1], yy=Y(S(d,a)*100);
        g+=`<line x1="${X(a)}" x2="${X(b)}" y1="${yy}" y2="${yy}" stroke="${col}" stroke-width="3"/>`;
        if(i>0) g+=`<circle cx="${X(a)}" cy="${yy}" r="5" fill="${col}"/>`;
        if(i<pts.length-2) g+=`<circle cx="${X(b)}" cy="${yy}" r="5" fill="var(--card)" stroke="${col}" stroke-width="2"/>`; }
    } else if(d.kind==='hist' && !st.even){
      for(let x=d.xmin;x<=d.xmax;x+=10) g+=`<circle cx="${X(x)}" cy="${Y(S(d,x)*100)}" r="6" fill="${col}"/>`;
      let pth=''; for(let x=d.xmin;x<=d.xmax;x+=1) pth+=(pth?' L':'M')+X(x)+','+Y(S(d,x)*100);
      g+=`<path d="${pth}" fill="none" stroke="${col}" stroke-width="1.5" stroke-dasharray="4 5" opacity=".6"/>`;
    } else {
      let pth=''; const s=(vmx(d)-d.xmin)/300; for(let x=d.xmin;x<=vmx(d)+1e-9;x+=s) pth+=(pth?' L':'M')+X(x)+','+Y(S(d,x)*100);
      g+=`<path d="${pth}" fill="none" stroke="${col}" stroke-width="3"/>`;
    }
    const x=st.x[d.key], yy=Y(S(d,x)*100);
    g+=`<line x1="${X(x)}" x2="${X(x)}" y1="${axisY}" y2="${yy}" stroke="${col}" stroke-dasharray="3 4"/>`;
    g+=`<circle cx="${X(x)}" cy="${yy}" r="7" fill="${col}" stroke="var(--card)" stroke-width="2"/>`;
  }
  if(st.mode===2){ const yy=Y(st.p);
    g+=`<line x1="${X(d0.xmin)}" x2="${W-PR}" y1="${yy}" y2="${yy}" stroke="var(--target)" stroke-width="2.5" stroke-dasharray="9 6"/>`;
    g+=`<text x="${X(d0.xmin)+4}" y="${yy-8}" font-size="15" font-weight="700" fill="var(--target)">target p = ${fmtP(st.p)}</text>`; }
  g+=`<line x1="${PL-6}" x2="${W-PR+6}" y1="${axisY}" y2="${axisY}" stroke="var(--ink)" stroke-width="1.4"/>`;
  ticksFor(d0).forEach((t,ti)=>{ if(ti%labelEvery(d0)===0) g+=`<text x="${X(t)}" y="${axisY+22}" text-anchor="middle" font-size="14" fill="var(--ink)">${t}</text>`; });
  g+=`<text x="${(X(d0.xmin)+W-PR)/2}" y="${axisY+40}" text-anchor="middle" font-size="14" fill="var(--muted)">${d0.xlabel}</text>`;
  return `<svg viewBox="0 0 ${W} ${H+8}">${g}</svg>`;
}

/* ================= readouts ================= */
function readouts(){
  return DS[st.dist].map(d=>{
    const x=st.x[d.key], xs=fmtX(d,x), who=d.name?`<span class="who" style="color:${d.key==='B'?'var(--B)':'var(--A)'}">${d.name}</span><br>`:'';
    if(d.kind==='hist'){        // a histogram shows P(X < x), not P(X = x): ask for P(X >= x) = 1 - P(X < x)
      const lt=S(d,x)*100, PL_=v=>M(`<i>P</i>(<i>X</i> &lt; ${v})`), PG=v=>M(`<i>P</i>(<i>X</i> ≥ ${v})`);
      return `<div class="ro">${who}<span class="big">${PL_(xs)} = ${countStr(d,x)} = <b>${fmtP(lt)}</b><br>${PG(xs)} = 1 − ${fmtP(lt)} = <b>${fmtP(100-lt)}</b></span>
        <br><small style="color:var(--muted)">${Pof(xs)} ≈ ${PL_(xs)}: data equal to ${xs} are counted to the right of the bar, so ${PL_(xs)} is used as an approximation of ${Pof(xs)}.</small></div>`;
    }
    const cnt = d.kind==='cont' ? '' : `${nof(xs)} = ${countStr(d,x).replace('/'+d.N,'')}<br>`;
    return `<div class="ro">${who}<span class="big">${cnt}${Pof(xs)} = ${d.kind==='cont'?'':countStr(d,x)+' = '}<b>${fmtP(S(d,x)*100)}</b></span></div>`;
  }).join('');
}

/* ================= banner ================= */
let demoMsg = '', ackResolve = null;          // status text while a demo runs / after it ends
function renderBanner(){
  const tEl=document.getElementById('task'), list=DS[st.dist], d0=list[0], tagOf=d=>d.name?d.key+': ':'';
  tEl.className = 'banner ' + (st.mode===1 ? 'fn' : 'inv');
  const key=`${st.dist}|${st.mode}|${st.even}|${st.run}`;
  if(tEl.dataset.key!==key){
    tEl.dataset.key=key;
    const inp = st.mode===1
      ? `<input id="tIn" type="number" inputmode="decimal" min="${d0.xmin}" max="${d0.xmax}" step="${stepOf(d0)}" value="${st.tx[st.dist]}" aria-label="target x">`
      : `<input id="tIn" type="number" inputmode="decimal" min="0" max="100" step="any" value="${+st.p.toFixed(2)}" aria-label="target p">%`;
    const play = st.run==='demo' ? `<button class="play" id="playBtn">▶ Play</button>` : '';
    const note = st.run==='demo'
      ? (st.mode===1 ? 'Choose x, then press Play: the bar moves in from the left until it reaches x.'
                     : 'Choose p, then press Play: the bar moves in from the left until P(X ≤ x) reaches p. If it jumps past p, the closer of the two neighbouring x-values wins (a tie goes to the larger x). The demo pauses at three key steps (overshoot, step back one, compare): press the button to continue.')
      : (st.mode===1 ? 'Type your own target, then drag the bar.' : "Type your own target, then drag the bar. If it can't match exactly, take the closest.");
    tEl.innerHTML = st.mode===1
      ? `<span class="tag">GOAL</span><span class="goal"><span class="dir">Function →</span> Set the bar at <span class="chip"><i>x</i> = ${inp}</span> and read <i>p</i>.</span>${play}<span class="status" id="tStat"></span><span class="note">${note}</span>`
      : `<span class="tag">GOAL</span><span class="goal"><span class="dir">← Inverse Function</span> Move the bar so that <span class="chip"><i>p</i> = ${inp}</span></span>${play}<span class="status" id="tStat"></span><span class="note">${note}</span>`;
  }
  let cls, txt;
  if(st.run==='demo'){ cls = demoMsg ? demoMsg.cls : 'go'; txt = demoMsg ? demoMsg.txt : 'Press Play'; }
  else if(st.mode===1){
    const tx=st.tx[st.dist], x=st.x[d0.key], g=snap(d0,tx);
    const ps=list.map(q=>tagOf(q)+'<i>p</i> '+(q.kind==='hist'?'≈':'=')+' '+fmtP(S(q,st.x[q.key])*100)).join(' · ');
    if(Math.abs(x-tx)<1e-6){ cls='ok'; txt='✓ On target → '+ps; }
    else if(Math.abs(x-g)<1e-6){ cls='near'; txt='≈ Closest possible → '+ps; }
    else { cls='go'; txt='Keep moving'; }
  } else {
    const r=list.map(d=>{ const x=st.x[d.key], pv=S(d,x)*100, diff=Math.abs(pv-st.p), c=closest(d,st.p);
      if(diff<1e-6) return {c:'ok',t:'✓ Exact'};
      if(Math.abs(pv-c.p)<1e-9) return isExact(d) ? {c:'ok',t:'✓ On target (p = '+fmtP(pv)+')'} : {c:'near',t:'≈ Closest (off by '+fmtP(diff)+')'};
      return {c:'go',t:'Keep moving'}; });
    cls = r.every(q=>q.c==='ok')?'ok' : r.some(q=>q.c==='go')?'go':'near';
    txt = list.length>1 ? r.map((q,i)=>tagOf(list[i])+q.t).join(' · ') : r[0].t;
  }
  const sEl=document.getElementById('tStat'); sEl.className='status '+cls; sEl.innerHTML=txt + (st.run==='demo' && demoMsg && demoMsg.ack ? ` <button class="ackBtn" id="ackBtn">${demoMsg.ack}</button>` : '');
}

/* ================= render ================= */
function render(){
  fitWidth();
  document.querySelectorAll('#distSeg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.d===st.dist));
  document.querySelectorAll('#modeSeg button').forEach(b=>b.setAttribute('aria-pressed', +b.dataset.m===st.mode));
  document.querySelectorAll('#runSeg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.r===st.run));
  document.getElementById('evenWrap').style.display = st.dist==='hist' ? '' : 'none';
  document.getElementById('evenChk').checked = st.even;
  document.getElementById('graphChk').checked = st.graph;
  renderBanner();
  document.getElementById('plots').innerHTML = DS[st.dist].map(plotSVG).join('');
  document.getElementById('readouts').innerHTML = readouts();
  const gc=document.getElementById('graphCard');
  const showG = st.graph && (!SHOT || shotParts.includes('graph'));
  gc.style.display = showG ? '' : 'none';
  if(showG){ document.getElementById('graph').innerHTML = graphSVG();
    document.getElementById('glegend').innerHTML = `<span>Graph of ${st.dist==='hist' ? M('<i>P</i>(<i>X</i> &lt; <i>x</i>)') : Pof('<i>x</i>')}</span>` + (st.dist==='hist'
      ? `<span><span class="sw" style="background:var(--A)"></span>Restaurant A</span><span><span class="sw" style="background:var(--B)"></span>Restaurant B</span>`:'')
      + (st.dist==='dot' ? `<span>● included &nbsp;○ not included</span>`:''); }
  if(SHOT && !shotParts.includes('task')) document.getElementById('task').style.display='none';
  if(SHOT && !shotParts.includes('readout')) document.getElementById('readouts').style.display='none';
}

/* ================= demo ================= */
let demoToken=0;
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const speed = d => d.kind==='cont' ? 70 : (d.kind==='hist' && st.even ? 110 : 420);
function stopDemo(){ const r=ackResolve; demoToken++; if(r) r(); }
function ack(txt, label){                         // pause the demo at a key step until the user presses the button
  return new Promise(res=>{ demoMsg={cls:'near', txt, ack:label};
    ackResolve=()=>{ ackResolve=null; demoMsg={cls:'go', txt:'Moving…'}; render(); res(); }; render();
    const b=document.getElementById('ackBtn'); if(b) b.focus(); });
}
document.getElementById('task').addEventListener('click', e=>{ if(e.target.closest('#ackBtn') && ackResolve) ackResolve(); });
function clearFx(){ st.fx={}; demoMsg=''; }
async function playDemo(){
  const token=++demoToken, list=DS[st.dist];
  clearFx(); demoMsg={cls:'go', txt:'Moving…'};
  for(const d of list) st.x[d.key]=d.xmin;
  render(); await sleep(500); if(token!==demoToken) return;
  let results;
  if(st.mode===1) results = await Promise.all(list.map(d => demoFn(d, token)));
  else { results=[]; for(const d of list){ results.push(await demoInv(d, token, list.length>1)); if(token!==demoToken) return; } }
  if(token!==demoToken) return;
  const tagOf=d=>d.name?d.key+': ':'';
  demoMsg = {cls: results.every(r=>r.cls==='ok')?'ok':'near', txt: list.map((d,i)=>tagOf(d)+results[i].txt).join(' · ')};
  render();
}
async function demoFn(d, token){                 // x → p: walk right to the chosen x, then flash p
  const target=snap(d, st.tx[st.dist]);
  while(st.x[d.key] < target-1e-9){
    await sleep(speed(d)); if(token!==demoToken) return {};
    st.x[d.key]=r3(st.x[d.key]+stepOf(d)); tick(); render(); }
  st.fx[d.key]={p:true}; render();
  return {cls:'ok', txt:`x = ${fmtX(d,target)} → p = ${fmtP(S(d,target)*100)}`};
}
async function demoInv(d, token, multi){
  const tg = multi ? d.key+': ' : '';                // p → x: walk right until P(X ≤ x) reaches p
  const p=st.p;
  for(;;){
    const pv=S(d,st.x[d.key])*100;
    if(Math.abs(pv-p)<1e-6){ st.fx[d.key]={x:true}; render();
      return {cls:'ok', txt:`✓ Exact: x = ${fmtX(d,st.x[d.key])}`}; }
    if(pv>p) break;                              // jumped past the target
    if(st.x[d.key]>=d.xmax-1e-9) return {cls:'near', txt:'p is never reached'};
    await sleep(speed(d)); if(token!==demoToken) return {};
    st.x[d.key]=r3(st.x[d.key]+stepOf(d)); tick(); render();
  }
  const xHi=st.x[d.key], pHi=S(d,xHi)*100;
  st.fx[d.key]={p:true, note:`exceeds ${fmtP(p)}`}; render();
  if(xHi<=d.xmin+1e-9){ st.fx[d.key]={x:true}; render(); return {cls:'near', txt:`x = ${fmtX(d,xHi)} (p = ${fmtP(pHi)})`}; }
  await ack(`${tg}Step 1 · Overshoot: at x = ${fmtX(d,xHi)}, p = ${fmtP(pHi)} is more than the target ${fmtP(p)}.`, 'Got it → step back one');
  if(token!==demoToken) return {};
  const xLo=r3(xHi-stepOf(d)), pLo=S(d,xLo)*100;
  st.fx[d.key]={note:`exceeds ${fmtP(p)}`, ghost:xLo, ghostP:true}; tick(); render();
  await ack(`${tg}Step 2 · Step back one: at x = ${fmtX(d,xLo)}, p = ${fmtP(pLo)} is less than the target ${fmtP(p)}.`, 'Got it → compare the two');
  if(token!==demoToken) return {};
  const dHi=Math.abs(pHi-p), dLo=Math.abs(pLo-p);
  const pick = dLo < dHi-1e-9 ? xLo : xHi;        // a tie goes to the larger x
  st.x[d.key]=pick; st.fx[d.key]={x:true, ghost: pick===xHi ? xLo : xHi}; render();
  await ack(`${tg}Step 3 · Compare: x = ${fmtX(d,xLo)} is off by ${fmtP(dLo)}, x = ${fmtX(d,xHi)} is off by ${fmtP(dHi)}. ${Math.abs(dLo-dHi)<1e-9?'A tie: take the larger x.':'Take the closer one.'}`, multi?'Got it → next':'Got it');
  if(token!==demoToken) return {};
  return {cls:'near', txt:`Closest: x = ${fmtX(d,pick)} (p = ${fmtP(S(d,pick)*100)}, off by ${fmtP(Math.min(dHi,dLo))})`};
}

/* ================= interaction ================= */
function setX(key, x){
  if(st.run==='demo') return;                   // in Demo the bar moves by itself
  const list=DS[st.dist]; let changed=false;
  for(const d of list){
    if((st.dist==='hist' && st.mode===1) || d.key===key){ const v=snap(d,x); if(Math.abs(v-st.x[d.key])>1e-9){ st.x[d.key]=v; changed=true; } } }
  if(changed){ tick(); render(); }
}
let drag=null;
document.getElementById('plots').addEventListener('pointerdown', e=>{
  const svg=e.target.closest('svg'); if(!svg || st.run==='demo') return;
  drag={key:svg.dataset.key, d:DS[st.dist].find(q=>q.key===svg.dataset.key)}; e.preventDefault(); move(e);
});
window.addEventListener('pointermove', e=>{ if(drag) move(e); });
window.addEventListener('pointerup', ()=>{ drag=null; });
function move(e){
  const svg=document.querySelector(`#plots svg[data-key="${drag.key}"]`); if(!svg) return;
  const r=svg.getBoundingClientRect(); if(!r.width) return;
  setX(drag.key, inv(drag.d, (e.clientX-r.left)/r.width*svg.viewBox.baseVal.width)); }
document.getElementById('plots').addEventListener('keydown', e=>{
  const svg=e.target.closest('svg'); if(!svg) return; const key=svg.dataset.key, d=DS[st.dist].find(q=>q.key===key);
  const dir = e.key==='ArrowRight'?1 : e.key==='ArrowLeft'?-1 : 0; if(!dir) return; e.preventDefault();
  setX(key, st.x[key]+dir*stepOf(d)); setTimeout(()=>{ const s=document.querySelector(`#plots svg[data-key="${key}"]`); s&&s.focus(); });
});
function reset(){ stopDemo(); clearFx(); render(); }
document.getElementById('distSeg').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; st.dist=b.dataset.d; reset(); });
document.getElementById('modeSeg').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; st.mode=+b.dataset.m;
  if(st.mode===1 && st.dist==='hist') st.x.B=st.x.A; reset(); });
document.getElementById('runSeg').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; st.run=b.dataset.r; reset(); });
document.getElementById('graphChk').addEventListener('change', e=>{ st.graph=e.target.checked; render(); });
document.getElementById('evenChk').addEventListener('change', e=>{ st.even=e.target.checked;
  for(const d of DS[st.dist]) st.x[d.key]=snap(d,st.x[d.key]); reset(); });
const task=document.getElementById('task');
task.addEventListener('input', e=>{
  if(e.target.id!=='tIn') return; const v=parseFloat(e.target.value); if(!isFinite(v)) return;
  const d0=DS[st.dist][0];
  if(st.mode===1) st.tx[st.dist]=Math.min(d0.xmax, Math.max(d0.xmin, v)); else st.p=Math.min(100, Math.max(0, v));
  if(st.run==='demo'){ stopDemo(); clearFx(); }
  render(); });
task.addEventListener('click', e=>{ if(e.target.id==='playBtn') playDemo(); });
task.addEventListener('keydown', e=>{ if(e.target.id==='tIn' && e.key==='Enter' && st.run==='demo') playDemo(); });

for(const d of [...DS.dot,...DS.hist,...DS.cont]) st.x[d.key]=snap(d,st.x[d.key]);
render();
if(st.run==='demo' && Q.get('autoplay')==='1') playDemo();
let rz; window.addEventListener('resize', ()=>{ clearTimeout(rz); rz=setTimeout(render,120); });
})();
</script>
</body>
